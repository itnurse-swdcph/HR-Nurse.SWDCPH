function frameworkDetail(unit){const positions=[['พยาบาลวิชาชีพ','RN'],['พนักงานช่วยเหลือคนไข้','NA'],['พนักงานประจำตึก','พนักงานประจำตึก']],rows=positions.map(([position,label])=>{const f=RD.F.find(x=>x.unit===unit&&x.position===position);return{position,label,quota:f?.quota??0,id:f?.id??null}});const editable=S.role!=='viewer';modal(`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="eyebrow">UNIT FRAMEWORK</div><h3 style="margin:2px 0">กรอบอัตรากำลัง · ${esc(unit)}</h3></div><button class="icon" onclick="closeM()" aria-label="ปิด">${uiIcon('close')}</button></div><p class="muted">จำนวนจริงของ RN รวมตำแหน่งนักวิชาการสาธารณสุข (พยาบาล) และไม่นับหัวหน้าทุกบทบาท</p><div class="tw framework-table"><table><tr><th>สายอาชีพ</th><th>กรอบ</th><th>จริง</th><th>GAP</th></tr>${rows.map((x,i)=>{const actual=RD.P.filter(p=>isCurrentNursingStaff(p)&&!isManpowerExcluded(p)&&p.unit===unit&&manpowerGroup(p.position)===x.position).length,gap=actual-Number(x.quota);return `<tr><td><b>${x.label}</b><div class="muted">${x.position}</div></td><td>${editable?`<input type="number" min="0" step="1" id="fq${i}" value="${Number(x.quota)}" style="width:90px">`:`<b>${Number(x.quota)}</b>`}</td><td>${actual}</td><td class="${gap>0?'gap-positive':gap<0?'gap-negative':''}">${gap>0?'+'+gap:gap}</td></tr>`}).join('')}</table></div>${editable?`<p class="muted">แก้ไขตัวเลขกรอบของแต่ละสายอาชีพ แล้วกดบันทึก ระบบจะปรับเฉพาะหน่วยงานนี้</p><p class="err" id="frameworkErr"></p><button class="p" onclick="saveFramework('${String(unit).replace(/'/g,"\\'")}')">บันทึกกรอบอัตรากำลัง</button> <button onclick="closeM()">ยกเลิก</button>`:''}`)}
