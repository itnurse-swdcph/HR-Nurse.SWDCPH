<script>
const SUPABASE_URL='https://cdhcparkigajxiiyjzjm.supabase.co',SUPABASE_KEY='sb_publishable_S7YJQGmgp0RIlvLsHpKB4Q_OFD0kmfL'; // ใช้ anon/publishable key เท่านั้น ห้ามใส่ service_role

async function api0(a,d){
 if(a==='login'){const r=await sb.auth.signInWithPassword({email:d.username+'@swdcph.app',password:d.password});if(r.error)throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
  return ok(await sb.from('profiles').select('role,unit').eq('user_id',r.data.user.id).maybeSingle())||{role:'viewer',unit:'-'}}
 if(a==='people')return{data:ok(await sb.from('personnel').select('*').order('name'))};
 if(a==='units')return{data:[...new Set(ok(await sb.from('framework').select('unit')).map(x=>x.unit))].filter(u=>S.unit==='*'||u===S.unit)};
 if(a==='dashboard'){const[p,f,e]=await Promise.all([sb.from('personnel').select('unit,position,planned_exit_date').eq('status','active'),sb.from('framework').select('*'),sb.from('events').select('type').gte('effective_date',mon())]),P=ok(p),E=ok(e);
  return{rows:ext(ok(f),P).map(x=>{const n=P.filter(y=>y.unit===x.unit&&y.position===x.position).length;return{unit:x.unit,position:x.position,quota:x.quota,actual:n,gap:x.quota-n}}),active:P.length,planned:P.filter(x=>x.planned_exit_date).length,hire:E.filter(x=>x.type==='hire').length,exit:E.filter(x=>x.type==='exit').length}}
 if(a==='framework')return{data:ok(await sb.from('framework').select('*'))};
 if(a==='events')return{data:ok(await sb.from('events').select('type,person_id,from_unit,to_unit,effective_date,reason').order('effective_date',{ascending:false}))};
 if(a==='hire'){const p=nul(d.person),r=ok(await sb.from('personnel').insert({...p,status:'active'}).select('id').single());ok(await sb.from('events').insert({type:'hire',person_id:r.id,to_unit:p.unit,effective_date:p.start_date}));return{}}
 const from=ok(await sb.from('personnel').select('unit').eq('id',d.id).single()).unit,dt=d.date||null;
 if(a==='exit'){ok(await sb.from('personnel').update({status:'exited',exit_date:dt,exit_reason:d.reason}).eq('id',d.id));ok(await sb.from('events').insert({type:'exit',person_id:d.id,from_unit:from,effective_date:dt,reason:d.reason}));return{}}
 if(a==='transfer'){ok(await sb.from('personnel').update({unit:d.to}).eq('id',d.id));ok(await sb.from('events').insert({type:'transfer',person_id:d.id,from_unit:from,to_unit:d.to,effective_date:dt,reason:d.reason}));return{}}
 throw new Error('unknown action')}
function render(){document.body.classList.toggle('signed-in',!!S);const items=[['dash','แดชบอร์ด','▦','ภาพรวมบุคลากร'],['people','ทะเบียนบุคลากร','♙','ทะเบียนบุคลากร'],['rep','รายงาน','⇩','ส่งออกรายงาน Excel'],['pw','รหัสผ่าน','⚿','เปลี่ยนรหัสผ่าน']];
 nav.innerHTML=S?items.map(([k,t,i])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()"><span class="nav-icon">${i}</span><span>${t}</span></button>`).join('')+`<button class="logout" onclick="sb.auth.signOut();sessionStorage.clear();S=null;render()"><span class="nav-icon">↪</span><span>ออกจากระบบ</span></button>`:'';
 const active=items.find(x=>x[0]===tab);const title=document.getElementById('page-title');if(title)title.textContent=active?active[3]:'เข้าสู่ระบบ';
 if(!S)return login();({dash,people,rep,pw})[tab]()}
function login(){$(`<div class="card login-card"><div class="eyebrow">WELCOME BACK</div><h3>เข้าสู่ระบบ</h3><p style="color:var(--muted);font-size:13px">ระบบบริหารจัดการบุคลากรทางการพยาบาล</p><p><input id="u" placeholder="ชื่อผู้ใช้"></p><p><input id="p" type="password" placeholder="รหัสผ่าน"></p><button class="p" onclick="doLogin()">เข้าสู่ระบบ</button><p class="err" id="e"></p></div>`)}
async function doLogin(){try{S=await api('login',{username:u.value.trim(),password:p.value});sessionStorage.setItem('s',JSON.stringify(S));render()}catch(x){e.textContent=x.message}}
function csv(rows,name){const k=Object.keys(rows[0]||{});const t=[k.join(','),...rows.map(r=>k.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n');
 const x=document.createElement('a');x.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));x.download=name+'.csv';x.click()}
async function dash(){$('กำลังโหลด…');try{const d=await api('dashboard');window.D=d;const sh=d.rows.reduce((a,r)=>a+Math.max(r.gap,0),0),ov=d.rows.reduce((a,r)=>a+Math.max(-r.gap,0),0),q=d.rows.reduce((a,r)=>a+r.quota,0);
 const bp={};d.rows.forEach(r=>{const o=bp[r.position]||(bp[r.position]={quota:0,actual:0,short:0,over:0});o.quota+=r.quota;o.actual+=r.actual;o.short+=Math.max(r.gap,0);o.over+=Math.max(-r.gap,0)});
 $(`<div class="kpi"><div class="card"><b>${d.active}</b>บุคลากรปฏิบัติงาน</div><div class="card"><b>${q}</b>กรอบรวม</div><div class="card"><b class="${sh?'bad':''}">${sh}</b>ขาดกรอบ (รวมเฉพาะหน่วยที่ขาด)</div><div class="card"><b>${ov}</b>เกินกรอบ</div><div class="card"><b>${d.hire}/${d.exit}</b>เข้า/ออก เดือนนี้</div><div class="card"><b class="${d.planned?'bad':''}">${d.planned}</b>ลาออกล่วงหน้า (ยัง Active)</div></div>
 <div class="card tw"><h3>สรุปรายตำแหน่ง</h3><table><tr><th>ตำแหน่ง</th><th>กรอบ</th><th>จริง</th><th>ขาด</th><th>เกิน</th></tr>${Object.entries(bp).map(([k,o])=>`<tr><td>${k}</td><td>${o.quota}</td><td>${o.actual}</td><td class="${o.short?'bad':''}">${o.short}</td><td>${o.over}</td></tr>`).join('')}</table></div>
 <div class="card tw"><p><button onclick="csv(D.rows,'gap-report')">ส่งออก CSV</button></p><table><tr><th>หน่วยงาน</th><th>ตำแหน่ง</th><th>กรอบ</th><th>จริง</th><th>GAP</th><th>สัดส่วน</th></tr>${d.rows.sort((a,b)=>b.gap-a.gap).map(r=>`<tr><td>${r.unit}</td><td>${r.position}</td><td>${r.quota}</td><td>${r.actual}</td><td class="${r.gap>0?'bad':''}">${r.gap}</td><td><div class="bar"><i style="width:${Math.min(100,r.quota?r.actual/r.quota*100:0)}%"></i></div></td></tr>`).join('')}</table></div>`)}catch(x){$(`<p class="err">${x.message}</p>`)}}
const opt=l=>l.map(x=>`<option>${x}</option>`).join(''),dl=(id,k)=>`<datalist id="${id}">${opt([...new Set(P.map(p=>p[k]).filter(Boolean))].sort(th))}</datalist>`,units=()=>[...new Set([...UN,...P.map(p=>p.unit)])].sort(th);

function pl(){const k=(q.value||'').trim(),w=S.role!=='viewer';document.getElementById('pl').innerHTML=`<table><tr><th>ชื่อ-สกุล</th><th>ตำแหน่ง</th><th>ระดับ</th><th>ประเภท</th><th>หน่วยงาน</th><th>บรรจุ</th><th>สถานะ</th><th>ลาออกล่วงหน้า</th><th>หมายเหตุ</th>${w?'<th></th>':''}</tr>${P.filter(r=>!k||(r.name+r.unit).includes(k)).map(r=>`<tr><td>${r.prefix||''}${r.name}</td><td>${r.position}</td><td>${r.level||''}</td><td>${r.type}</td><td>${r.unit}</td><td>${be(r.start_date)}</td><td>${r.status==='active'?'ปฏิบัติงาน':'ออกแล้ว'}</td><td class="${r.planned_exit_date?'bad':''}">${r.planned_exit_date?be(r.planned_exit_date):''}</td><td>${r.note||''}</td>${w?`<td>${r.status==='active'?`<button class="sm" onclick="mvForm('${r.id}')">ย้าย/ออก</button>`:''}</td>`:''}</tr>`).join('')}</table>`}

 sup:{n:'สายสนับสนุน',f:D=>{const A=D.P.filter(p=>p.status==='active'&&!NURSE.includes(p.position)),K=[...new Set(A.map(p=>p.unit+'¦'+p.position))].sort(th),TY=['ข้าราชการ','ลูกจ้างประจำ','พนักงานกระทรวงสาธารณสุข','ลูกจ้างชั่วคราวรายเดือน','ลูกจ้างชั่วคราวรายวัน'];

 mov:{n:'การเคลื่อนไหว',f:D=>{const m=Object.fromEntries(D.P.map(p=>[p.id,(p.prefix||'')+p.name]));return[['วันที่มีผล','ประเภท','ชื่อ-สกุล','จากหน่วย','ไปหน่วย','เหตุผล'],...D.E.map(e=>[be(e.effective_date),TH_TYPE[e.type]||e.type,m[e.person_id]||'',e.from_unit||'',e.to_unit||'',e.reason||''])]}}};
