<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Nurse SWDCPH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');
:root{color-scheme:light;--bg:#f4f7fb;--fg:#18263b;--muted:#718096;--card:#fff;--ac:#176b87;--ac2:#20a4a8;--bd:#e5ebf2;--bad:#c24155;--ok:#188a72;--nav:#10243d;--shadow:0 12px 32px rgba(31,58,87,.07)}
*{box-sizing:border-box}body{margin:0;font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:15px}
.app-shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:258px;padding:24px 16px;background:linear-gradient(165deg,#10243d 0%,#153d59 62%,#176b87 100%);color:#fff;display:flex;flex-direction:column;z-index:10;box-shadow:8px 0 28px rgba(16,36,61,.08)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 28px;border-bottom:1px solid rgba(255,255,255,.13)}
.brand-mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#4ce0d1,#58a8ff);color:#10243d;font-weight:800;font-size:19px;box-shadow:0 8px 20px rgba(41,199,195,.2)}
.brand-title{font-size:16px;font-weight:800;letter-spacing:.2px}.brand-sub{font-size:11px;color:#b9d0e2;margin-top:2px}
.nav-label{font-size:10px;letter-spacing:1.7px;color:#8da9c1;font-weight:700;padding:24px 12px 10px}
nav{display:flex;flex-direction:column;gap:7px}
nav button,button{font:inherit;padding:10px 13px;border-radius:11px;border:1px solid var(--bd);background:#fff;color:var(--fg);cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#c4d5e4;padding:12px 13px;font-weight:500}
nav button .nav-icon{width:22px;text-align:center;font-size:17px;opacity:.95}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}nav button.on{background:linear-gradient(100deg,rgba(63,211,205,.22),rgba(91,165,255,.15));border-color:rgba(107,222,224,.22);color:#fff;box-shadow:inset 3px 0 #51d8ce}
nav button.logout{margin-top:auto;color:#f7cbd0}nav button.logout:hover{background:rgba(255,255,255,.09)}
.sidebar-foot{margin-top:auto;padding:18px 10px 0;color:#9bb4ca;font-size:11px;line-height:1.7}
.workspace{margin-left:258px;min-height:100vh}.topbar{min-height:82px;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:rgba(255,255,255,.82);border-bottom:1px solid var(--bd);backdrop-filter:blur(16px)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ac2);font-weight:800}.page-heading{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:2px 0 0}.topbar-note{font-size:12px;color:var(--muted)}.user-chip{display:flex;align-items:center;gap:10px;background:#f2f7fa;border:1px solid #e4edf4;border-radius:14px;padding:8px 12px;font-size:12px;color:#35516b}.user-avatar{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,#d4f7ef,#dceaff);display:grid;place-items:center;color:#176b87;font-weight:800}
main{max-width:1500px;margin:auto;padding:28px 32px 42px}
.card{background:var(--card);border:1px solid rgba(222,231,241,.9);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 16px;font-size:17px;font-weight:800;letter-spacing:-.2px}.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.kpi .card{margin:0;min-height:142px;position:relative;overflow:hidden;padding:21px 22px}.kpi .card:after{content:'';position:absolute;width:100px;height:100px;right:-32px;top:-32px;border-radius:50%;background:linear-gradient(135deg,rgba(32,164,168,.12),rgba(88,168,255,.08))}
.kpi b{font-size:34px;line-height:1.2;display:block;margin-bottom:9px;letter-spacing:-1px;color:#18334d}.kpi .card:nth-child(2) b{color:#176b87}.kpi .card:nth-child(3) b{color:#c24155}.kpi .card:nth-child(4) b{color:#188a72}.kpi .card{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:13px 14px;border-bottom:1px solid #edf1f6;text-align:left;white-space:nowrap}th{background:#f7f9fc;color:#63768c;font-size:11px;font-weight:800;letter-spacing:.35px;text-transform:none}tbody tr:hover td{background:#f9fcff}tr:last-child td{border-bottom:0}
input,select{font:inherit;padding:11px 12px;border:1px solid #dbe4ee;border-radius:10px;background:#fff;color:var(--fg);width:100%;outline:none;transition:border .15s,box-shadow .15s}input:focus,select:focus{border-color:#42a8b7;box-shadow:0 0 0 3px rgba(32,164,168,.12)}input::placeholder{color:#9aa9b8}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.g label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
button.p{background:linear-gradient(105deg,#176b87,#20a4a8);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 6px 15px rgba(23,107,135,.17)}button.p:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(23,107,135,.23)}
.bar{height:8px;background:#e9eff5;border-radius:99px;min-width:90px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#176b87,#39c6b5)}
.bad{color:var(--bad);font-weight:700}.err{color:var(--bad);font-weight:600}.login-card{max-width:420px;margin:9vh auto!important;padding:34px!important}.login-card h3{font-size:24px}.login-card .p{width:100%;padding:12px}
body:not(.signed-in) .sidebar{width:100%;height:78px;position:relative;inset:auto;flex-direction:row;align-items:center;padding:14px 24px}.signed-in .sidebar .brand{border:0;padding:0}.signed-in .sidebar .nav-label{display:block}.signed-in .sidebar-foot{display:block}
body:not(.signed-in) .workspace{margin-left:0}body:not(.signed-in) .topbar{display:none}body:not(.signed-in) main{padding:20px}
@media(max-width:1050px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:24px}.sidebar{width:220px}.workspace{margin-left:220px}}
@media(max-width:700px){.sidebar{width:100%;height:auto;position:relative;inset:auto;padding:14px 14px 12px}.signed-in .sidebar{width:100%}.brand{padding:0 4px 14px!important}.signed-in .sidebar .brand{border-bottom:1px solid rgba(255,255,255,.13);padding-bottom:14px!important}.nav-label{padding:14px 8px 7px!important}nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}nav button{padding:10px 8px;font-size:12px}.sidebar-foot{display:none!important}.workspace{margin-left:0}.topbar{padding:16px 18px;min-height:70px}.topbar-note{display:none}.user-chip{padding:6px}.user-chip span:last-child{display:none}main{padding:18px 14px 28px}.kpi{gap:10px}.kpi .card{padding:16px;min-height:120px}.kpi b{font-size:28px}.card{padding:17px;border-radius:15px}th,td{padding:10px 11px}}
</style></head><body>
<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">HR</div><div><div class="brand-title">HR Nurse</div><div class="brand-sub">SWDCPH · NURSING</div></div></div><div class="nav-label">WORKSPACE</div><nav id="nav"></nav><div class="sidebar-foot">กลุ่มการพยาบาล<br>โรงพยาบาลสมเด็จพระยุพราชสว่างแดนดิน</div></aside><section class="workspace"><header class="topbar"><div><div class="eyebrow">NURSING HUMAN RESOURCES</div><div class="page-heading" id="page-title">ภาพรวมบุคลากร</div></div><div class="user-chip"><div class="user-avatar">N</div><span>HR Nurse SWDCPH</span></div></header><main id="m"></main></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://cdhcparkigajxiiyjzjm.supabase.co',SUPABASE_KEY='sb_publishable_S7YJQGmgp0RIlvLsHpKB4Q_OFD0kmfL'; // ใช้ anon/publishable key เท่านั้น ห้ามใส่ service_role
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let S=JSON.parse(sessionStorage.getItem('s')||'null'),tab='dash';
const $=(h)=>{m.innerHTML=h},be=d=>{if(!d)return'';const[y,mo,da]=String(d).slice(0,10).split('-');return`${da}/${mo}/${+y+543}`};
const ok=r=>{if(r.error)throw new Error(r.error.message);return r.data},nul=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v===''?null:v])),mon=()=>new Date().toISOString().slice(0,8)+'01';
async function api(a,d={}){try{return await api0(a,d)}catch(x){if(/JWT|expired/i.test(x.message)){sessionStorage.clear();S=null;render();throw new Error('หมดอายุ กรุณาเข้าสู่ระบบใหม่')}throw x}}
async function api0(a,d){
 if(a==='login'){const r=await sb.auth.signInWithPassword({email:d.username+'@swdcph.app',password:d.password});if(r.error)throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
  return ok(await sb.from('profiles').select('role,unit').eq('user_id',r.data.user.id).maybeSingle())||{role:'viewer',unit:'-'}}
 if(a==='people')return{data:ok(await sb.from('personnel').select('*').order('name'))};
 if(a==='units')return{data:[...new Set(ok(await sb.from('framework').select('unit')).map(x=>x.unit))].filter(u=>S.unit==='*'||u===S.unit)};
 if(a==='dashboard'){const[p,f,e]=await Promise.all([sb.from('personnel').select('unit,position').eq('status','active'),sb.from('framework').select('*'),sb.from('events').select('type').gte('effective_date',mon())]),P=ok(p),E=ok(e);
  return{rows:ok(f).map(x=>{const n=P.filter(y=>y.unit===x.unit&&y.position===x.position).length;return{unit:x.unit,position:x.position,quota:x.quota,actual:n,gap:x.quota-n}}),active:P.length,hire:E.filter(x=>x.type==='hire').length,exit:E.filter(x=>x.type==='exit').length}}
 if(a==='hire'){const p=nul(d.person),r=ok(await sb.from('personnel').insert({...p,status:'active'}).select('id').single());ok(await sb.from('events').insert({type:'hire',person_id:r.id,to_unit:p.unit,effective_date:p.start_date}));return{}}
 const from=ok(await sb.from('personnel').select('unit').eq('id',d.id).single()).unit,dt=d.date||null;
 if(a==='exit'){ok(await sb.from('personnel').update({status:'exited',exit_date:dt,exit_reason:d.reason}).eq('id',d.id));ok(await sb.from('events').insert({type:'exit',person_id:d.id,from_unit:from,effective_date:dt,reason:d.reason}));return{}}
 if(a==='transfer'){ok(await sb.from('personnel').update({unit:d.to}).eq('id',d.id));ok(await sb.from('events').insert({type:'transfer',person_id:d.id,from_unit:from,to_unit:d.to,effective_date:dt,reason:d.reason}));return{}}
 throw new Error('unknown action')}
function render(){document.body.classList.toggle('signed-in',!!S);const items=[['dash','แดชบอร์ด','▦','ภาพรวมบุคลากร'],['people','ทะเบียนบุคลากร','♙','ทะเบียนบุคลากร'],['rec','บันทึกเข้า-ออก','⇄','บันทึกเข้า-ออก']];
 nav.innerHTML=S?items.map(([k,t,i])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()"><span class="nav-icon">${i}</span><span>${t}</span></button>`).join('')+`<button class="logout" onclick="sb.auth.signOut();sessionStorage.clear();S=null;render()"><span class="nav-icon">↪</span><span>ออกจากระบบ</span></button>`:'';
 const active=items.find(x=>x[0]===tab);const title=document.getElementById('page-title');if(title)title.textContent=active?active[3]:'เข้าสู่ระบบ';
 if(!S)return login();({dash,people,rec})[tab]()}
function login(){$(`<div class="card login-card"><div class="eyebrow">WELCOME BACK</div><h3>เข้าสู่ระบบ</h3><p style="color:var(--muted);font-size:13px">ระบบบริหารจัดการบุคลากรทางการพยาบาล</p><p><input id="u" placeholder="ชื่อผู้ใช้"></p><p><input id="p" type="password" placeholder="รหัสผ่าน"></p><button class="p" onclick="doLogin()">เข้าสู่ระบบ</button><p class="err" id="e"></p></div>`)}
async function doLogin(){try{S=await api('login',{username:u.value.trim(),password:p.value});sessionStorage.setItem('s',JSON.stringify(S));render()}catch(x){e.textContent=x.message}}
async function dash(){$('กำลังโหลด…');try{const d=await api('dashboard'),g=d.rows.reduce((a,r)=>a+Math.max(r.gap,0),0),q=d.rows.reduce((a,r)=>a+r.quota,0);
 $(`<div class="eyebrow" style="margin:0 0 12px 3px">WORKFORCE OVERVIEW</div><div class="kpi"><div class="card"><b>${d.active}</b>บุคลากรปฏิบัติงาน</div><div class="card"><b>${q}</b>กรอบรวม</div><div class="card"><b class="${g?'bad':''}">${g}</b>GAP (ขาด)</div><div class="card"><b>${d.hire}/${d.exit}</b>เข้า/ออก เดือนนี้</div></div>
 <div class="card tw"><table><tr><th>หน่วยงาน</th><th>ตำแหน่ง</th><th>กรอบ</th><th>จริง</th><th>GAP</th><th>สัดส่วน</th></tr>${d.rows.sort((a,b)=>b.gap-a.gap).map(r=>`<tr><td>${r.unit}</td><td>${r.position}</td><td>${r.quota}</td><td>${r.actual}</td><td class="${r.gap>0?'bad':''}">${r.gap}</td><td><div class="bar"><i style="width:${Math.min(100,r.quota?r.actual/r.quota*100:0)}%"></i></div></td></tr>`).join('')}</table></div>`)}catch(x){$(`<p class="err">${x.message}</p>`)}}
async function people(){$('กำลังโหลด…');const d=(await api('people')).data;window.P=d;
 $(`<div class="card"><input id="q" placeholder="ค้นหาชื่อ/หน่วยงาน" oninput="pl()"></div><div class="card tw" id="pl"></div>`);pl()}
function pl(){const k=(q.value||'').trim();document.getElementById('pl').innerHTML=`<table><tr><th>ชื่อ-สกุล</th><th>ตำแหน่ง</th><th>ระดับ</th><th>ประเภท</th><th>หน่วยงาน</th><th>บรรจุ</th><th>สถานะ</th></tr>${P.filter(r=>!k||(r.name+r.unit).includes(k)).map(r=>`<tr><td>${r.prefix||''}${r.name}</td><td>${r.position}</td><td>${r.level}</td><td>${r.type}</td><td>${r.unit}</td><td>${be(r.start_date)}</td><td>${r.status}</td></tr>`).join('')}</table>`}
async function rec(){$('กำลังโหลด…');const [pp,un]=await Promise.all([api('people'),api('units')]);window.P=pp.data;const U=un.data,A=P.filter(r=>r.status==='active'),o=l=>l.map(x=>`<option>${x}</option>`).join('');
 $(`<div class="card"><h3>รับเข้า/บรรจุ</h3><div class="g"><input id="pf" placeholder="คำนำหน้า"><input id="pn" placeholder="ชื่อ-สกุล"><input id="pp" placeholder="ตำแหน่ง เช่น พยาบาลวิชาชีพ"><input id="pl2" placeholder="ระดับ"><input id="pt" placeholder="ประเภทเจ้าหน้าที่"><select id="pu">${o(U)}</select><label>วันที่บรรจุ<input id="ps" type="date"></label><label>วันเกิด<input id="pb" type="date"></label></div><p><button class="p" onclick="hire()">บันทึกรับเข้า</button></p></div>
 <div class="card"><h3>ออก / ย้ายหน่วย</h3><div class="g"><select id="xp">${A.map(r=>`<option value="${r.id}">${r.name} (${r.unit})</option>`).join('')}</select><select id="xk"><option value="exit">ออก</option><option value="transfer">ย้ายหน่วย</option></select><select id="xt">${o(U)}</select><input id="xr" placeholder="เหตุผล (ลาออก/เกษียณ/โอน…)"><input id="xd" type="date"></div><p><button class="p" onclick="mv()">บันทึก</button></p></div><p id="msg"></p>`)}
const done=t=>{msg.textContent=t;setTimeout(rec,900)};
async function hire(){try{await api('hire',{person:{prefix:pf.value,name:pn.value,position:pp.value,level:pl2.value,type:pt.value,unit:pu.value,start_date:ps.value,birth_date:pb.value}});done('บันทึกแล้ว')}catch(x){msg.textContent=x.message}}
async function mv(){try{await api(xk.value,{id:xp.value,date:xd.value,reason:xr.value,to:xt.value});done('บันทึกแล้ว')}catch(x){msg.textContent=x.message}}
render();
</script></body></html>
